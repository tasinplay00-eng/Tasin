name: Pulse CI & Production Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Lint & Test Android App & Supabase Schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache-dependency-path: 'package.json'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Environment File from GitHub Secrets
        run: |
          touch .env
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          fi
          if [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          fi
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          fi
        shell: bash

      - name: Validate Supabase SQL Schema syntax
        run: |
          echo "Verifying Supabase migration files..."
          test -f supabase/migrations/20260907000001_initial_schema.sql
          test -f supabase/migrations/20260907000002_storage_and_buckets.sql
          test -f supabase/seed/seed.sql
          echo "All Supabase migrations verified."

      - name: Run Unit Tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew testDebugUnitTest --no-daemon || gradle testDebugUnitTest --no-daemon

      - name: Build Debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew assembleDebug --no-daemon || gradle assembleDebug --no-daemon

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pulse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
